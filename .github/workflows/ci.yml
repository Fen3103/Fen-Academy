# Pruebas en cada push y pull request: reglas de seguridad de la base y sintaxis de la página.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas de la base (RLS, matrícula, exámenes, archivos)
        working-directory: supabase/pruebas
        run: npm install && npm test
      - name: Sintaxis de la página
        run: for f in web/js/*.js web/js/vistas/*.js; do node --check "$f"; done
