# Supabase gratis pausa el proyecto tras 7 días sin actividad.
# Esta tarea hace una consulta pequeña cada 3 días para que no se pause.
# Usa solo la clave pública (la misma que está en web/js/config.js).
name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 12 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Consultar la base de datos
        run: |
          URL=$(grep -oE 'https://[a-z0-9]+\.supabase\.co' web/js/config.js | head -1)
          KEY=$(grep -oE 'sb_publishable_[A-Za-z0-9_-]+' web/js/config.js | head -1)
          code=$(curl -s -o respuesta.txt -w '%{http_code}' -X POST "$URL/rest/v1/rpc/usuario_disponible" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{"p_usuario":"ping-mantener-activo"}')
          echo "HTTP $code: $(cat respuesta.txt)"
          test "$code" = "200"
