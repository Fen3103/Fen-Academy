# Publica la carpeta web/ en GitHub Pages en cada push a main (y a mano desde Actions).
# Requisito (una vez): Settings → Pages → Source: "GitHub Actions".
name: Publicar página

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      # Agrega ?v=<commit> a los archivos propios para que el navegador no use una versión vieja.
      - name: Versionar archivos
        run: |
          V="${GITHUB_SHA::7}"
          sed -i -E "s#(from \"\.\.?/[^\"]+\.js)\"#\1?v=$V\"#g" $(find web/js -name '*.js')
          sed -i -E "s#(href=\"css/style\.css)\"#\1?v=$V\"#; s#(src=\"js/main\.js)\"#\1?v=$V\"#" web/index.html
          grep -rn "?v=" web/index.html web/js/main.js | head -5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v5
