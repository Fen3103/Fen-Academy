<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fen Academy</title>
    <meta name="description" content="Fen Academy: aula virtual para aprender programación. Clases, entregas, exámenes y notas.">
    <meta name="theme-color" content="#050816">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff7b00'/%3E%3Cpath d='M20 16h26v8H29v7h14v8H29v13h-9z' fill='white'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/styles/github-dark.min.css">
    <script>
        try {
            var t = localStorage.getItem("fen-tema") || "oscuro";
            if (t === "auto") t = matchMedia("(prefers-color-scheme: light)").matches ? "claro" : "oscuro";
            document.documentElement.dataset.tema = t;
            document.documentElement.dataset.acento = localStorage.getItem("fen-acento") || "naranja";
        } catch (e) {}
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app"><div class="auth-page"><div class="auth-box"><h1>Fen Academy</h1><p>Cargando…</p></div></div></div>
    <noscript>Fen Academy necesita JavaScript activado.</noscript>
    <script type="module" src="js/main.js"></script>
</body>
</html>
